<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-box">

    <div class="auth-logo">CSC</div>

    <h1>Welcome Back</h1>
    <p>Login to your attendance account.</p>

    <div class="role-switch">

        <button type="button"
                onclick="setLoginRole('student')"
                id="studentRole"
                class="role active">
            🎓 Student
        </button>

        <button type="button"
                onclick="setLoginRole('faculty')"
                id="facultyRole"
                class="role">
            👨‍🏫 Faculty
        </button>

    </div>

    <form id="loginForm">

        <label>Username</label>
        <input type="text"
               id="loginUsername"
               placeholder="Enter username"
               required>

       <label>Password</label>

<div class="password-box">
    <input type="password" 
           id="loginPassword" 
           placeholder="Enter password" 
           required>

    <button type="button" 
            class="show-password" 
            onclick="togglePassword()">
        👁
    </button>
</div>
<button type="submit" class="btn primary full">
    Login →
    </button>

    </form>

    <p id="loginMessage"></p>

    <p class="register-text">
        New student?
        <a href="register.html">Create Account</a>
    </p>
    <p class="back-home">
        <a href="index.html">← Back to Home</a>
    </p>


</div>

<script src="script.js"></script>

</body>
</html>
